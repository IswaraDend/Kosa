server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Excel stock imports are uploaded through this proxy; nginx's 1 MB default
    # would reject them with a 413 before the request ever reached Go.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API is served from this same origin, so the browser never makes a
    # cross-origin request and CORS never comes into play at all.
    #
    # The trailing slash on proxy_pass is load-bearing: it strips the /api
    # prefix, so /api/login reaches the backend as /login. Without it the
    # backend would see /api/login and answer 404 for every single call.
    # The external API keeps its own prefix. Without this block the rule below
    # would strip /api and a third party would have to call
    # https://<host>/api/api/v1/products, which is what docs/api-v1.md does not
    # say and nobody would guess. Longest prefix wins in nginx, so this takes
    # precedence over /api/ for these paths only; no dashboard route begins
    # with /api/v1/, so nothing else changes.
    #
    # Note the missing trailing slash on proxy_pass: here the path must reach
    # the backend unchanged, which is the exact opposite of the rule below.
    location /api/v1/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Vite fingerprints these filenames, so a given URL's content never changes
    # and it can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, otherwise a browser keeps loading an old
    # copy that points at asset filenames the new deploy no longer has.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # React Router owns the URL space. Any path that is not a real file has to
    # return index.html, or reloading /super-admin/projects gives a 404 because
    # no such file exists on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
